name: acousticslab
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
version_schema: none
section: sound
priority: optional
maintainer: "AcousticsLab <noreply@acousticslab.local>"
vendor: "AcousticsLab"
license: "Apache-2.0"
description: |
  On-device real-time sound event detection.
  Ships the acousticslabd daemon (UDS-only HTTP/WebSocket/SSE control plane,
  hybrid NPU/CPU inference), the acousticslab-webd console front (static SPA +
  reverse proxy to the daemon socket), and the `acousticslab` management CLI
  (device discovery, backbone fetch, status). Includes systemd units, a default
  CPU backbone, and a default classifier head.

recommends:
  - alsa-utils
  - curl

overrides:
  deb:
    depends:
      - libc6 (>= ${LIBC_VERSION})
      - libasound2t64 | libasound2
  rpm:
    depends:
      - glibc >= ${LIBC_VERSION}
      - alsa-lib

contents:

  - src: ${DAEMON_BIN}
    dst: /usr/bin/acousticslabd
    file_info:
      mode: 0755
  - src: ${WEBD_BIN}
    dst: /usr/bin/acousticslab-webd
    file_info:
      mode: 0755
  - src: ${CLI_BIN}
    dst: /usr/bin/acousticslab
    file_info:
      mode: 0755

  - src: ./packaging/etc/launch.toml
    dst: /etc/acousticslab/launch.toml
    type: config|noreplace
    file_info:
      mode: 0644
  - src: ./packaging/etc/web.env
    dst: /etc/acousticslab/web.env
    type: config|noreplace
    file_info:
      mode: 0644

  - src: ./misc/backbones/backbone.mpk
    dst: /usr/share/acousticslab/backbones/backbone.mpk
    file_info:
      mode: 0644
  - src: ./misc/heads/default/head.mpk
    dst: /usr/share/acousticslab/heads/default/head.mpk
    file_info:
      mode: 0644
  - src: ./misc/heads/default/labels.txt
    dst: /usr/share/acousticslab/heads/default/labels.txt
    file_info:
      mode: 0644

  - src: ./web/build
    dst: /usr/share/acousticslab/web
    type: tree

  - src: ./packaging/systemd/acousticslabd.service
    dst: /usr/lib/systemd/system/acousticslabd.service
    file_info:
      mode: 0644
  - src: ./packaging/systemd/acousticslab-web.service
    dst: /usr/lib/systemd/system/acousticslab-web.service
    file_info:
      mode: 0644

  - src: ./LICENSE
    dst: /usr/share/doc/acousticslab/LICENSE
    file_info:
      mode: 0644

scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh
