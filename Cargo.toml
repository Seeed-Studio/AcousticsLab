[package]
name = "acousticslab"
edition.workspace = true
version.workspace = true
license = "Apache-2.0"
publish = false

[lib]
name = "acousticslab"
path = "modules/lib.rs"

[[bin]]
name = "acousticslabd"
path = "modules/bin/acousticslabd.rs"

[dependencies]
thiserror = { workspace = true }
arc-swap = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
dashmap = { workspace = true }
time = { workspace = true, features = ["serde-human-readable", "macros"] }
# Subset of `full`: only the features the daemon uses.
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { workspace = true, features = ["rt", "io"] }
tracing = { workspace = true }

clap = { version = "=4.6.1", features = ["derive"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
tracing-appender = "=0.2.5"
anyhow = "=1.0.102"
# Optional global allocator (binary only). v3 via absent `v2` -- do NOT add `v2`.
mimalloc = { version = "=0.1.52", default-features = false, features = ["extended"], optional = true }
# Direct dep for `mi_collect`; unifies with mimalloc's transitive copy.
libmimalloc-sys = { version = "=0.1.49", default-features = false, features = ["extended"], optional = true }

opus = "=0.3.1"
rubato = { workspace = true }
audioadapter-buffers = { workspace = true }
rustfft = "6"
realfft = "3"
hound = "3"

# default-features off: drop unused `form` + `original-uri`; keep the rest.
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "matched-path",
    "multipart",
    "query",
    "tokio",
    "tower-log",
    "tracing",
    "ws",
] }
hyper = "=1.10.1"
# HTTP/1.1-only (WS upgrade pins listeners to http1), so no `server-auto`.
hyper-util = { version = "=0.1.20", features = ["server", "tokio", "service"] }
libc = "=0.2.186"
futures-util = { workspace = true }

notify = "=8.2.0"
toml = { workspace = true }
# Drop sysinfo's `network`, `component`, `user` defaults; the
# daemon only samples process info, CPU, and disk usage.
sysinfo = { version = "=0.39.3", default-features = false, features = ["disk", "system"] }

burn = { workspace = true, features = ["std", "ndarray"] }
burn-ndarray = { version = "=0.21.0", default-features = false, features = ["std", "simd"] }

rayon = "1"
libloading = { version = "0.9", optional = true } # RKNN loader (`rknpu`)

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "=0.11.0", optional = true }

[build-dependencies]
prost-build = "=0.14.4"

[dev-dependencies]
criterion = { workspace = true }
tokio-tungstenite = "=0.29.0"
# Test-only: backdates fixture mtime for deterministic age/retention assertions.
filetime = "=0.2.29"
# test-only features (`process`: lifecycle tests spawn the binary as a subprocess).
tokio = { workspace = true, features = ["test-util", "process"] }
tower = { workspace = true, features = ["util"] }
http-body-util = "=0.1.3"
urlencoding = "=2.1.3"
nix = { workspace = true, features = ["signal"] }
# Only `tests/audio_buffer_loom.rs` under `RUSTFLAGS=--cfg audio_buffer_loom`;
# target-cfg-gated so a plain `cargo test` never pulls loom into the build graph.
# Custom cfg name (not bare `loom`) avoids tripping tokio's `cfg(not(loom))` gates.
[target.'cfg(audio_buffer_loom)'.dev-dependencies]
loom = "=0.7.2"

[[bench]]
name = "audio_buffer_ring_throughput"
path = "tests/benches/audio_buffer_ring_throughput.rs"
harness = false

[[bench]]
name = "inference_engine_run_window"
path = "tests/benches/inference_engine_run_window.rs"
harness = false

[[bench]]
name = "opus_stream_encode_frame"
path = "tests/benches/opus_stream_encode_frame.rs"
harness = false

[[example]]
name = "opus_stream_soak"

[[example]]
name = "regen_fixtures"

[[example]]
name = "diagnose_head"

# Live mic inference (macOS); see the file header to run.
[[example]]
name = "live_infer"

[features]
default = ["autodiff", "mimalloc"]
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
alsa-real = ["dep:alsa"]
autodiff = ["burn/autodiff", "burn-ndarray/multi-threads"]
rknpu = ["dep:libloading"]
panic-inject = []

[lints]
workspace = true

[workspace]
resolver = "2"
members = []

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
tokio = "=1.52.3"
tokio-util = "=0.7.18"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "registry"] }
thiserror = "=2.0.18"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
toml = "=1.1.2"
uuid = "=1.23.3"
time = "=0.3.47"
arc-swap = "=1.9.1"
parking_lot = { version = "=0.12.5", features = ["arc_lock"] }
dashmap = "=6.2.1"
bytes = "=1.11.1"
prost = "=0.14.4"
sha2 = "=0.11.0"
burn = { version = "=0.21.0", default-features = false }
rubato = "=3.0.0"
audioadapter-buffers = "=3.0.0"
axum = { version = "=0.8.9", default-features = false }
tower = "=0.5.3"
futures-util = "=0.3.32"
tempfile = "=3.27.0"
criterion = { version = "=0.8.2", default-features = false }
nix = { version = "=0.31.3", default-features = false, features = ["fs"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
debug-assertions = false
overflow-checks  = false

[profile.release-embedded]
inherits      = "release"
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = "symbols"
panic         = "unwind"
debug-assertions = false
overflow-checks  = false

[workspace.lints.clippy]
disallowed_types   = "warn"
disallowed_methods = "warn"
