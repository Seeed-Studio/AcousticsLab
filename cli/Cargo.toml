[package]
name = "acousticslab-cli"
edition.workspace = true
version.workspace = true
license = "Apache-2.0"
publish = false

[[bin]]
name = "acousticslab"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
anyhow = "=1.0.103"
toml_edit = "=0.22.27"
sha2 = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "=0.12.0"

[lints]
workspace = true
